<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="16" y="16" width="480" height="480" rx="100" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="6"/>
  <rect x="24" y="24" width="464" height="464" rx="92" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.4"/>

  <!-- Subtle Cyber Tech Grid Pattern -->
  <circle cx="256" cy="180" r="140" fill="#0284c7" opacity="0.08"/>
  <circle cx="256" cy="180" r="100" fill="#fbbf24" opacity="0.06"/>

  <!-- Tech Icon Symbol (Laptop + Phone Combo) -->
  <g transform="translate(166, 75)">
    <!-- Laptop screen -->
    <rect x="25" y="15" width="130" height="85" rx="8" fill="#1e293b" stroke="url(#cyanGrad)" stroke-width="3"/>
    <rect x="33" y="23" width="114" height="69" rx="4" fill="#0f172a"/>
    <!-- Laptop base -->
    <path d="M5 105 L175 105 L160 115 L20 115 Z" fill="url(#cyanGrad)"/>
    <!-- Phone overlay -->
    <rect x="125" y="45" width="45" height="75" rx="8" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="3" filter="url(#glow)"/>
    <circle cx="147.5" cy="52" r="2.5" fill="#94a3b8"/>
    <rect x="135" y="112" width="25" height="3" rx="1.5" fill="#f59e0b"/>
  </g>

  <!-- Brand Title: PST -->
  <text x="256" y="275" font-family="'Segoe UI', Roboto, 'Arial Black', sans-serif" font-size="76" font-weight="900" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="4" filter="url(#glow)">PST</text>

  <!-- Arabic Sub-brand: المستورد -->
  <rect x="110" y="305" width="292" height="52" rx="26" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <text x="256" y="342" font-family="'Cairo', 'Segoe UI', Tahoma, Arial, sans-serif" font-size="30" font-weight="800" fill="#ffffff" text-anchor="middle">المـســتـورد</text>

  <!-- Tagline / Slogan -->
  <text x="256" y="395" font-family="'Segoe UI', Tahoma, sans-serif" font-size="20" font-weight="600" fill="#94a3b8" text-anchor="middle">لابتوبات • موبايلات • إكسسوارات</text>
  <text x="256" y="425" font-family="'Segoe UI', Tahoma, sans-serif" font-size="15" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="1">استيراد فرز أول A+ و جديد بالضمان</text>
</svg>
